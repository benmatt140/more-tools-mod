name: Build mod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Pick latest Forge build for this Minecraft version
        run: |
          mkdir -p ci-out
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          curl -s https://maven.minecraftforge.net/net/minecraftforge/forge/maven-metadata.xml -o meta.xml
          LATEST=$(grep -o "<version>${MC}-[^<]*</version>" meta.xml | sed -e 's/<version>//' -e 's#</version>##' | sort -V | tail -1)
          FV=${LATEST#${MC}-}
          echo "Using Forge $FV" | tee ci-out/forge-version.txt
          echo "FORGE_VERSION=$FV" >> "$GITHUB_ENV"

      - name: Dump API signatures (for development)
        if: ${{ hashFiles('ci-api-classes.txt') != '' }}
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew printClasspath -Pforge_version=$FORGE_VERSION > ci-out/classpath-task.log 2>&1
          CP=$(tr '\n' ':' < build/classpath.txt)
          while read -r c; do
            [ -z "$c" ] && continue
            echo "===== $c" >> ci-out/api.txt
            javap -public -cp "$CP" "$c" >> ci-out/api.txt 2>&1 || true
          done < ci-api-classes.txt

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build -Pforge_version=$FORGE_VERSION --stacktrace 2>&1 | tee ci-out/build.log
          cp build/libs/*.jar ci-out/

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: moretools-jar
          path: build/libs/*.jar

      - name: Test-start a Minecraft server with the mod
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\n' > run/server.properties
          ./gradlew runServer -Pforge_version=$FORGE_VERSION > ci-out/server-console.log 2>&1 &
          PID=$!
          for i in $(seq 1 120); do
            if grep -q 'Done (' ci-out/server-console.log 2>/dev/null; then echo "Server started"; break; fi
            if ! kill -0 $PID 2>/dev/null; then echo "Server process exited early"; break; fi
            sleep 5
          done
          sleep 15
          pkill -f 'net.minecraftforge' || true
          kill $PID 2>/dev/null || true
          sleep 5
          cp run/logs/latest.log ci-out/server-latest.log 2>/dev/null || true
          echo "----- log lines mentioning moretools with problems -----"
          grep -iE 'moretools' ci-out/server-console.log | grep -iE 'error|exception|fail|couldn|invalid|unknown' || echo "none"
          grep -q 'Done (' ci-out/server-console.log

      - name: Run automated in-game tests
        if: ${{ !cancelled() && hashFiles('build/libs/*.jar') != '' }}
        run: |
          cp -r src/gametest/java/. src/main/java/
          cp -r src/gametest/resources/. src/main/resources/
          rm -rf run
          mkdir -p run
          echo "eula=true" > run/eula.txt
          set +e
          timeout 900 ./gradlew runGameTestServer -Pforge_version=$FORGE_VERSION > ci-out/gametest-console.log 2>&1
          CODE=$?
          set -e
          cp run/logs/latest.log ci-out/gametest-latest.log 2>/dev/null || true
          echo "exit code $CODE" | tee ci-out/gametest-exit.txt
          grep -iE "test|moretools" ci-out/gametest-console.log | grep -iE "pass|fail|succeed|error|exception|required|optional|moretools" | tail -60 || true
          exit $CODE

      - name: Publish CI output to the ci-output branch
        if: always()
        run: |
          cd ci-out
          echo "${{ github.sha }} ${{ job.status }}" > status.txt
          git init -q -b ci-output
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "CI output for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-output
