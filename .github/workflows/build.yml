name: Build mod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Pick latest Forge build for this Minecraft version
        run: |
          mkdir -p ci-out
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          curl -s https://maven.minecraftforge.net/net/minecraftforge/forge/maven-metadata.xml -o meta.xml
          LATEST=$(grep -o "<version>${MC}-[^<]*</version>" meta.xml | sed -e 's/<version>//' -e 's#</version>##' | sort -V | tail -1)
          FV=${LATEST#${MC}-}
          echo "Using Forge $FV" | tee ci-out/forge-version.txt
          echo "FORGE_VERSION=$FV" >> "$GITHUB_ENV"

      - name: Dump API signatures (for development)
        if: ${{ hashFiles('ci-api-classes.txt') != '' }}
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew printClasspath -Pforge_version=$FORGE_VERSION > ci-out/classpath-task.log 2>&1
          CP=$(tr '\n' ':' < build/classpath.txt)
          while read -r c; do
            [ -z "$c" ] && continue
            echo "===== $c" >> ci-out/api.txt
            javap -public -cp "$CP" "$c" >> ci-out/api.txt 2>&1 || true
          done < ci-api-classes.txt

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build -Pforge_version=$FORGE_VERSION --stacktrace 2>&1 | tee ci-out/build.log
          cp build/libs/*.jar ci-out/

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: moretools-jar
          path: build/libs/*.jar

      - name: Test-start a Minecraft server with the mod
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\n' > run/server.properties
          ./gradlew runServer -Pforge_version=$FORGE_VERSION > ci-out/server-console.log 2>&1 &
          PID=$!
          for i in $(seq 1 120); do
            if grep -q 'Done (' ci-out/server-console.log 2>/dev/null; then echo "Server started"; break; fi
            if ! kill -0 $PID 2>/dev/null; then echo "Server process exited early"; break; fi
            sleep 5
          done
          sleep 15
          pkill -f 'net.minecraftforge' || true
          kill $PID 2>/dev/null || true
          sleep 5
          cp run/logs/latest.log ci-out/server-latest.log 2>/dev/null || true
          echo "----- log lines mentioning moretools with problems -----"
          grep -iE 'moretools' ci-out/server-console.log | grep -iE 'error|exception|fail|couldn|invalid|unknown' || echo "none"
          grep -q 'Done (' ci-out/server-console.log

      - name: Run automated in-game tests
        if: ${{ !cancelled() && hashFiles('ci-out/*.jar') != '' }}
        run: |
          ./gradlew clean -q
          cp -r src/gametest/java/. src/main/java/
          cp -r src/gametest/resources/. src/main/resources/
          rm -rf run
          mkdir -p run
          echo "eula=true" > run/eula.txt
          set +e
          timeout 900 ./gradlew runGameTestServer --no-build-cache --info -Pforge_version=$FORGE_VERSION > ci-out/gametest-console.log 2>&1
          CODE=$?
          set -e
          cp run/logs/latest.log ci-out/gametest-latest.log 2>/dev/null || true
          cp run/crash-reports/*.txt ci-out/ 2>/dev/null || true
          find build -name '*.class' > ci-out/gametest-dirs.txt 2>&1; find build -name 'mods.toml' >> ci-out/gametest-dirs.txt; ls -la build build/sourceSets/main >> ci-out/gametest-dirs.txt 2>&1
          (javap -v build/sourceSets/main/com/benmatt/moretools/MoreTools.class 2>&1 || javap -v build/classes/java/main/com/benmatt/moretools/MoreTools.class 2>&1) | grep -A3 RuntimeVisibleAnnotations >> ci-out/gametest-dirs.txt || true
          echo "exit code $CODE" | tee ci-out/gametest-exit.txt
          grep -iE "test|moretools" ci-out/gametest-console.log | grep -iE "pass|fail|succeed|error|exception|required|optional|moretools" | tail -60 || true
          exit $CODE

      - name: Start the game client and check textures/models load
        if: ${{ !cancelled() && hashFiles('ci-out/*.jar') != '' }}
        continue-on-error: true
        run: |
          git checkout -- src/main || true
          git clean -fdq src/main || true
          ./gradlew clean -q
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb imagemagick mesa-utils libgl1-mesa-dri libglx-mesa0 libgl1 libegl1 mesa-vulkan-drivers > /dev/null
          rm -rf run && mkdir -p run
          printf 'onboardAccessibility:false\nskipMultiplayerWarning:true\ntutorialStep:none\n' > run/options.txt
          export LIBGL_ALWAYS_SOFTWARE=1
          Xvfb :99 -screen 0 1280x720x24 +extension GLX +render -noreset > /dev/null 2>&1 &
          sleep 3
          DISPLAY=:99 glxinfo -B > ci-out/glxinfo.txt 2>&1 || true
          export DISPLAY=:99
          ./gradlew runClient --no-build-cache -Pforge_version=$FORGE_VERSION > ci-out/client-console.log 2>&1 &
          for i in $(seq 1 60); do
            if grep -qE 'Created: .*textures/atlas/items|Sound engine started|Narrator library' ci-out/client-console.log 2>/dev/null; then break; fi
            sleep 5
          done
          sleep 30
          import -window root ci-out/client-screenshot.png || true
          pkill -f 'net.minecraftforge' || true
          sleep 5
          cp run/logs/latest.log ci-out/client-latest.log 2>/dev/null || true
          echo "----- client problems mentioning moretools -----"
          grep -iE 'moretools' ci-out/client-console.log | grep -iE 'missing|error|unable|fail|warn' || echo "none"

      - name: Publish release download
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          TAG="v${VER}-mc${MC}"
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "More Tools ${VER} for Minecraft ${MC} (Forge)" \
              --notes "Download the .jar below and put it in your Minecraft mods folder. Needs Forge ${FORGE_VERSION} or newer for Minecraft ${MC}."
          fi
          gh release upload "$TAG" ci-out/*.jar --clobber

      - name: Publish CI output to the ci-output branch
        if: always()
        run: |
          cd ci-out
          echo "${{ github.sha }} ${{ job.status }}" > status.txt
          git init -q -b ci-output
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "CI output for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-output
