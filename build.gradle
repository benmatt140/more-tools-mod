plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = mod_version
group = 'com.benmatt.moretools'

base {
    archivesName = "moretools-${minecraft_version}"
}

// Minecraft 26.1+ runs on Java 25
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
        }

        register('client')

        register('server') {
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    annotationProcessor "net.minecraftforge:eventbus-validator:${eventbus_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources) {
    def props = [
        mod_version      : mod_version,
        forge_spec       : forge_version.split('\\.')[0],
        minecraft_version: minecraft_version,
        minecraft_next   : minecraft_next
    ]
    inputs.properties(props)
    filesMatching('META-INF/mods.toml') {
        expand(props)
    }
}

// Helper used by CI: writes the compile classpath to a file so API signatures can be inspected.
tasks.register('printClasspath') {
    def cp = configurations.compileClasspath
    def out = layout.buildDirectory.file('classpath.txt')
    outputs.file(out)
    doLast {
        out.get().asFile.text = cp.files.collect { it.absolutePath }.join('\n')
    }
}
